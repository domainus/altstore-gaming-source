name: Update AltStore source

on:
  workflow_dispatch:
  push:
    paths:
      - apps.json
      - scripts/update_source.py
      - .github/workflows/update.yml
      - tests/test_source.py
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: altstore-source-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate source from upstream IPAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_source.py
      - name: Validate generated source
        run: python3 -m unittest discover -s tests -v
      - name: Commit update if changed
        run: |
          if ! git diff --quiet -- source.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add source.json
            git commit -m 'Update AltStore app releases'
            git push
          else
            echo 'Source already up to date.'
          fi
